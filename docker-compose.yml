version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sheetimitra_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-production-ready-key
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sheetimitra_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
